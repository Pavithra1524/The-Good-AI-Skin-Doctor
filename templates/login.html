{% extends "base.html" %}

{% block title %}Login - Good AI Skin Doctor{% endblock %}

{% block content %}

<div class="container py-5">
    <div class="card shadow-lg mx-auto" style="max-width: 500px;">
        <div class="card-body">
            <!-- {% with messages = get_flashed_messages(with_categories=true) %} -->
              <!-- {% if messages %}
                {% for category, message in messages %}
                  <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
              {% endif %} -->
            {% endwith %}
            <form method="POST" action="{{ url_for('login') }}">
                <label class="form-label">Email:</label>
                <input type="email" class="form-control mb-3" name="email" required>
                <label class="form-label">Password:</label>
                <input type="password" class="form-control mb-3" name="password" required>
                <button type="submit" class="btn btn-primary w-100">Login</button>
            </form>
            <p class="mt-3">Don't have an account? <a href="{{ url_for('register') }}" >Register here</a>.</p>
            <p class="mt-2"><a href="{{ url_for('login_otp') }}">Login with OTP</a></p>
        </div>
    </div>
</div>

{% include '_chatbot_button.html' %}
{% endblock %}
